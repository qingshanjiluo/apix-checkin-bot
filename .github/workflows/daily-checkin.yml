name: 中转站每日签到 + 余额巡检

# 北京时间 08:10 / 14:10 / 20:10 / 02:10 各跑一次。
# GitHub 高峰期会把 schedule 触发推迟几个小时，多留槽位保证当天必签成功（脚本幂等，多跑只会提示"今日已签到"）。
on:
  schedule:
    - cron: "10 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只查询不签到"
        required: false
        default: false
        type: boolean
      only_site:
        description: "只跑某个站点（填名称或域名关键字，留空=全部）"
        required: false
        default: ""
      notify_on:
        description: "通知策略"
        required: false
        default: "on_failure"
        type: choice
        options:
          - on_failure
          - always
          - on_success
      publish:
        description: "是否把结果回写到仓库（更新 签到结果.md 与状态徽标）"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: relay-daily-checkin
  cancel-in-progress: false

jobs:
  checkin:
    name: 登录 · 签到 · 查余额 · 回写结果
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 载入历史台账（status 分支）
        run: |
          mkdir -p state
          if git ls-remote --exit-code --heads origin status >/dev/null 2>&1; then
            git fetch -q --depth 1 origin status
            for f in ledger.csv last-run.json badge.json; do
              if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
                git show "FETCH_HEAD:$f" > "state/$f"
              fi
            done
            echo "已载入 status 分支历史数据：$(wc -l < state/ledger.csv 2>/dev/null || echo 0) 行台账"
          else
            echo "status 分支还不存在，本次为首轮"
          fi

      - name: 执行签到巡检
        env:
          SITES_JSON: ${{ secrets.SITES_JSON }}
          CHECKIN_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          CHECKIN_NOTIFY_ON: ${{ github.event.inputs.notify_on || 'on_failure' }}
          CHECKIN_ATTEMPTS: "4"
          CHECKIN_TIMEOUT: "30"
          CHECKIN_LOW_USD: ""          # 填数字（如 2）则余额低于 $2 的站标红
          CHECKIN_USD_RATE: "7.2"      # 折算人民币展示用汇率
          RESULT_MD: state/latest.md
          RESULT_JSON: state/last-run.json
          BADGE_JSON: state/badge.json
          LEDGER_CSV: state/ledger.csv      # 每日进账台账（只追加）
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
        run: |
          if [ -z "$SITES_JSON" ]; then
            echo "::error::未设置 Secret SITES_JSON（内容见 README：站点数组 JSON）"
            exit 2
          fi
          set +e
          python checkin.py --site "${{ github.event.inputs.only_site }}"
          echo "CHECKIN_EXIT=$?" >> "$GITHUB_ENV"
          set -e

      - name: 回写状态分支（不与代码分支抢提交）
        if: always() && github.event.inputs.publish != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d state ] || [ -z "$(ls -A state 2>/dev/null)" ]; then
            echo "没有生成任何结果文件，跳过回写"
            exit 0
          fi
          TMP=$(mktemp -d)
          cp -a state/. "$TMP/"
          printf '# 自动签到状态数据（自动生成，勿手改）\n\n本分支由 GitHub Actions 每次运行后重建，用来把结果和代码分支分开：\n\n- `latest.md` 最新一次结果：成功数 / 本次到账 / 合计余额 / 每站明细 / 每日进账台账\n- `ledger.csv` 每日进账台账（追加式，跨运行累积）\n- `last-run.json` 机器可读结果\n- `badge.json` README 顶部那枚徽标的数据源\n\n在线看：<https://github.com/%s/blob/status/latest.md>\n' "${GITHUB_REPOSITORY}" > "$TMP/README.md"
          cd "$TMP"
          git init -q -b status .
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "status: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push -f -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:status
          echo "已推送到 status 分支（$(date -u '+%Y-%m-%d %H:%M') UTC）"

      - name: 按巡检结果决定本次运行状态
        if: always()
        run: |
          code=${CHECKIN_EXIT:-1}
          if [ "$code" != "0" ]; then
            echo "::error::有站点签到失败（退出码 $code），详见上方表格"
            exit "$code"
          fi
          echo "✅ 全部站点处理完成"

      - name: 排查提示
        if: failure()
        run: |
          echo "::notice title=排查::1) SITES_JSON 是否为合法 JSON 数组；" \
               "2) 站点是否开了人机验证（这类站只能手动点签到）；" \
               "3) 账号是否被风控/需要重新验证邮箱。详见上方表格与日志。"
